packages:
  - "apps/*"
  - "packages/*"

saveExact: true

overrides:
  multer: 2.5.0
  deepmerge-ts: 8.0.2
  js-yaml: 5.5.0
  "minimatch@<11.0.1": 11.0.4

allowBuilds:
  unrs-resolver: true
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  esbuild: true
  msgpackr-extract: true
  prisma: true
